# Read by Vercel to deploy the backend (backend/README.md, Deploy). Local development installs
# backend/requirements.txt instead: keep these runtime packages in sync with it (no pytest, no uvicorn).
[project]
name = "dryroute-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "osmnx==2.1.1",
    "networkx==3.7",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "pymongo==4.18.2",
    "icalendar==7.3.0",
    "recurring-ical-events==3.8.2",
    "httpx==0.28.1",
    "tzdata==2026.4",
]

[tool.vercel]
entrypoint = "index:app"
